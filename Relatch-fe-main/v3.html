<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 2026-11-20 (Manas picked option B): the white Relatch mark on a black rounded tile, so the tab icon shows on
         light AND dark tab bars (the bare white mark vanished on light ones). /logo.png stays as it was. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Relatch — Turn documents into AI skills</title>
    <meta name="description" content="Turn any document into a skill for Claude or Codex." />
    <!-- 2026-11-20: app.relatch.online is the one address shared, so its link preview is its own (same copy and
         image as the landing page's, the image served from this app, nothing loaded from relatch.online) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Relatch" />
    <meta property="og:url" content="https://app.relatch.online/" />
    <meta property="og:title" content="Relatch | Turn Your Documents into AI Skill Files" />
    <meta property="og:description" content="Relatch is the context compiler. It turns the documents you already have into verified, portable skills for any AI agent." />
    <meta property="og:image" content="https://app.relatch.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Relatch, the context compiler. Documents in, verified agent skills out." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Relatch | Turn Your Documents into AI Skill Files" />
    <meta name="twitter:description" content="Relatch is the context compiler. It turns the documents you already have into verified, portable skills for any AI agent." />
    <meta name="twitter:image" content="https://app.relatch.online/og-image.png" />
    <meta name="twitter:image:alt" content="Relatch, the context compiler. Documents in, verified agent skills out." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 2026-11-28 (blank-page report): the Google Fonts stylesheet is added by src/v3/main.tsx, no longer here. A
         stylesheet in <head> holds the whole app back (its script waits for it and nothing paints), so a hung
         fonts.googleapis.com left a black page that never finished loading. -->
    <!-- The watchdog (public/boot-watch.js): outside the bundle, so it still runs when the bundle never arrives -->
    <script async src="/boot-watch.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/v3/main.tsx"></script>
  </body>
</html>
